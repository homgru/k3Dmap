name: Refresh Onbid auction data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *' # 07:17 Asia/Seoul

permissions:
  contents: write

concurrency:
  group: onbid-auction-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Onbid data and update map snapshot
        env:
          ONBID_SERVICE_KEY: ${{ secrets.ONBID_SERVICE_KEY }}
        run: python scripts/update_onbid_auctions.py
      - name: Publish changed GeoJSON snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/onbid-auctions.geojson data/onbid-geocode-cache.json
          if git diff --cached --quiet; then
            echo "No Onbid data changes."
          else
            git commit -m "Refresh Onbid auction data"
            git push
          fi
